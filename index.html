      "potentialAction": {

  <body>
    <!-- Inline critical CSS splash to prevent FOUC -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#fff;font-family:'Ubuntu',sans-serif;}
      #root{height:100%;width:100%;}
      .app-splash{
        position:fixed;inset:0;background:#6D28D9;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        z-index:9999;transition:opacity .4s ease;
      }
      .app-splash.hidden{opacity:0;pointer-events:none;}
      .splash-logo{font-size:2.5rem;font-weight:800;color:#fff;letter-spacing:-1px;}
      .splash-sub{font-size:.9rem;color:rgba(255,255,255,.8);margin-top:.5rem;}
      .splash-spinner{
        width:40px;height:40px;border:3px solid rgba(255,255,255,.3);
        border-top:3px solid #fff;border-radius:50%;
        animation:spin .8s linear infinite;margin-top:2rem;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- Kill any stale service workers immediately, before React loads -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }
    </script>

    <!-- Splash Screen -->
    <div id="app-splash" class="app-splash">
      <div class="splash-logo">Pedejá</div>
      <div class="splash-sub">Peça. Nós entregamos.</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash after React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('app-splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 500);
          }
        }, 800);
      });

      // Global safety net: clear SW + caches then hard-reload
      function __boomHardReset() {
        var keys = ['boomrider_orders','boomrider_pending_requests','boomrider_restaurants',
                    'boomrider_menu_items','boomrider_appconfig','boomrider_riders'];
        keys.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
        var doReload = function() {
          // Add cache-busting query param to force bypass HTTP cache
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          window.location.replace(window.location.pathname + sep + '_cb=' + Date.now());
        };
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            Promise.all(regs.map(function(r){ return r.unregister(); })).then(function() {
              if (typeof caches !== 'undefined') {
                caches.keys().then(function(ks) {
                  Promise.all(ks.map(function(k){ return caches.delete(k); })).then(doReload);
                }).catch(doReload);
              } else { doReload(); }
            });
          }).catch(doReload);
        } else { doReload(); }
      }

      var __boomLastErr = '';
      function __boomShowError() {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
          'padding:32px;text-align:center;font-family:\'Noto Sans Portuguese\',\'Ubuntu\',sans-serif;' +
          'background:linear-gradient(160deg,#F5F3FF 0%,#fff 40%,#eff6ff 100%)">' +
          '<div style="font-size:52px;margin-bottom:16px">⚠️</div>' +
          '<h2 style="color:#DC2626;font-size:20px;font-weight:800;margin-bottom:8px">โหลดแอปไม่สำเร็จ</h2>' +
          '<p style="color:#6b7280;margin-bottom:6px;max-width:320px;line-height:1.6">ไฟล์บางอย่างโหลดผิดพลาด กดล้างแคชและโหลดใหม่เพื่อดาวน์โหลดเวอร์ชันล่าสุด</p>' +
          (__boomLastErr ? '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin-bottom:16px;max-width:320px;text-align:left"><p style="color:#7C3AED;font-size:12px;font-weight:700;margin-bottom:4px">รายละเอียดข้อผิดพลาด:</p><p style="color:#991b1b;font-size:11px;word-break:break-all;font-family:monospace;margin:0">' + __boomLastErr.substring(0,160) + '</p></div>' : '') +
          '<button onclick="__boomHardReset()" style="background:linear-gradient(to right,#6D28D9,#5B21B6);' +
          'color:white;border:none;border-radius:14px;padding:14px 36px;font-weight:bold;' +
          'font-size:16px;cursor:pointer;box-shadow:0 4px 12px rgba(249,115,22,0.3);margin-bottom:10px">' +
          '🗑️ ล้างแคชและโหลดใหม่</button><br>' +
          '<button onclick="window.location.reload()" style="background:transparent;color:#9ca3af;border:1px solid #e5e7eb;' +
          'border-radius:14px;padding:10px 24px;font-size:13px;cursor:pointer;margin-top:4px">' +
          '🔄 โหลดใหม่เฉยๆ</button></div>';
      }

      window.addEventListener('error', function(e) {
        __boomLastErr = (e.message || '') + (e.filename ? ' @ ' + e.filename.split('/').pop() : '');
        setTimeout(__boomShowError, 3000);
      });
      window.addEventListener('unhandledrejection', function(e) {
        __boomLastErr = String(e.reason && e.reason.message ? e.reason.message : e.reason || 'Promise rejected');
        setTimeout(__boomShowError, 3000);
      });
    </script>
  </body>
</html>
